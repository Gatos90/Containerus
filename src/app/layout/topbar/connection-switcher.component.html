<div class="relative inline-block text-sm">
  <button
    #trigger
    type="button"
    role="combobox"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="open() ? optionId(activeIndex()) : null"
    aria-label="Switch active connection"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-zinc-800/80 hover:bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-zinc-950 min-w-[12rem]"
    [style.border-color]="accentColor()"
  >
    @if (activeOption().id === 'local') {
      <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border-2 border-zinc-400 text-[11px] text-zinc-300" aria-hidden="true">L</span>
    } @else {
      <app-connection-badge
        [connectionId]="activeOption().id"
        [connectionLabel]="activeOption().label"
        size="md"
      />
    }
    <span class="flex-1 text-left truncate">{{ activeOption().label }}</span>
    <span
      class="w-1.5 h-1.5 rounded-full flex-shrink-0"
      [ngClass]="statusDotClass(activeOption().status)"
      aria-hidden="true"
    ></span>
    <span class="sr-only">, {{ statusLabel(activeOption().status) }}</span>
    <svg aria-hidden="true" class="w-3 h-3 text-zinc-500" viewBox="0 0 12 12"><path fill="currentColor" d="M3 4.5L6 7.5L9 4.5"/></svg>
  </button>

  @if (open()) {
    <ul
      [id]="listboxId"
      role="listbox"
      aria-label="Connections"
      tabindex="-1"
      (keydown)="onListKeydown($event)"
      class="absolute left-0 top-[calc(100%+4px)] min-w-[18rem] max-h-80 overflow-auto rounded-lg bg-zinc-900 border border-zinc-700 shadow-xl z-50 py-1 focus:outline-none"
    >
      @for (opt of options(); track opt.id; let i = $index) {
        <li
          [id]="optionId(i)"
          role="option"
          [attr.aria-selected]="activeIndex() === i"
          (mouseenter)="activeIndex.set(i)"
          (mousedown)="$event.preventDefault(); selectIndex(i)"
          class="flex items-center gap-2 px-3 py-2 cursor-pointer"
          [class.bg-zinc-800]="activeIndex() === i"
        >
          @if (opt.id === 'local') {
            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border-2 border-zinc-400 text-[11px] text-zinc-300" aria-hidden="true">L</span>
          } @else {
            <app-connection-badge [connectionId]="opt.id" [connectionLabel]="opt.label" size="md" />
          }
          <span class="flex-1 min-w-0">
            <span class="block text-zinc-100 truncate">{{ opt.label }}</span>
            @if (opt.sub) {
              <span class="block text-[11px] text-zinc-500 truncate">{{ opt.sub }}</span>
            }
          </span>
          <span class="flex items-center gap-1.5 text-[11px] text-zinc-400">
            <span class="w-1.5 h-1.5 rounded-full" [ngClass]="statusDotClass(opt.status)" aria-hidden="true"></span>
            {{ statusLabel(opt.status) }}
          </span>
        </li>
      }
    </ul>
  }
</div>
