<div
  #scroller
  class="relative overflow-auto border border-zinc-700 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60"
  [style.height.px]="viewportHeight()"
  role="listbox"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-activedescendant]="activeDescendantId()"
  tabindex="0"
  (scroll)="onScroll($event)"
  (keydown)="onKeydown($event)"
>
  <div [style.height.px]="totalHeight()" aria-hidden="true"></div>
  <div
    class="absolute inset-x-0 top-0"
    [style.transform]="'translateY(' + topSpacerHeight() + 'px)'"
  >
    @for (entry of visibleRows(); track entry.row.id) {
      <div
        role="option"
        [id]="rowId(entry.index)"
        [attr.data-grid-row]="entry.index"
        [attr.aria-setsize]="rowCount()"
        [attr.aria-posinset]="entry.index + 1"
        [attr.aria-selected]="focusedIndex() === entry.index"
        tabindex="-1"
        class="flex items-center px-3 border-b border-zinc-800 outline-none aria-selected:bg-blue-950/40 aria-selected:ring-2 aria-selected:ring-blue-500/60 aria-selected:ring-inset"
        [style.height.px]="rowHeight()"
      >
        <ng-container
          *ngTemplateOutlet="rowTemplate(); context: { $implicit: entry.row, index: entry.index }"
        ></ng-container>
      </div>
    }
  </div>
</div>
