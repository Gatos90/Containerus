<input
  #input
  type="text"
  [attr.inputmode]="inputModeAttr()"
  autocomplete="one-time-code"
  [attr.id]="inputId()"
  [attr.maxlength]="length()"
  [attr.minlength]="mode() === 'totp' ? length() : 1"
  [attr.pattern]="pattern()"
  [attr.aria-label]="ariaLabelAttr()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="describedById()"
  [attr.disabled]="disabled() ? '' : null"
  class="rounded border bg-zinc-900 px-3 py-2 text-center text-lg font-mono tracking-[0.4em] tabular-nums text-zinc-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
  [class.border-red-600]="invalid()"
  [class.border-zinc-700]="!invalid()"
  [class.w-40]="mode() === 'totp'"
  [class.w-72]="mode() !== 'totp'"
  (input)="onInput($event)"
/>
