@switch (mode()) {
  @case ('error') {
    <div role="alert" class="rounded border border-red-700/60 bg-red-950/30 p-4 text-sm text-red-200">
      <p class="font-medium">{{ error() }}</p>
      <button
        #retryButton
        type="button"
        class="mt-3 inline-flex items-center rounded bg-red-800 px-3 py-1.5 text-sm text-white hover:bg-red-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-red-400"
        (click)="onRetry()"
      >
        {{ retryLabel() }}
      </button>
    </div>
  }
  @case ('loading') {
    <div role="status" aria-busy="true" class="flex items-center gap-2 p-4 text-sm text-zinc-400">
      <svg aria-hidden="true" class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".25" stroke-width="3"></circle>
        <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
      </svg>
      <span>{{ loadingLabel() }}</span>
    </div>
  }
  @case ('empty') {
    <div aria-live="off" class="rounded border border-dashed border-zinc-700 p-6 text-center text-sm text-zinc-400">
      <p class="font-medium text-zinc-200">{{ emptyHeadline() }}</p>
      @if (emptyDescription()) {
        <p class="mt-1 text-xs">{{ emptyDescription() }}</p>
      }
    </div>
  }
  @default {
    <ng-content></ng-content>
  }
}
