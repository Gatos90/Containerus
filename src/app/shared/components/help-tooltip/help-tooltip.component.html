<span class="relative inline-flex items-center">
  <!-- Trigger icon -->
  <button
    (click)="toggle(); $event.stopPropagation()"
    class="flex items-center justify-center text-zinc-600 hover:text-zinc-400 transition-colors focus:outline-none focus-visible:text-zinc-400"
    [attr.aria-label]="'Help: ' + copy.title"
    [attr.aria-expanded]="open()"
  >
    <lucide-icon [img]="HelpCircle" class="w-3.5 h-3.5"></lucide-icon>
  </button>

  <!-- Popover -->
  @if (open()) {
    <div
      class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-50 w-64 sm:w-72"
      (click)="$event.stopPropagation()"
    >
      <!-- Arrow -->
      <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 rotate-45 bg-zinc-800 border-r border-b border-zinc-700/60"></div>

      <!-- Card -->
      <div class="bg-zinc-800 border border-zinc-700/60 rounded-xl shadow-xl p-3.5">
        <div class="flex items-start justify-between gap-2 mb-2">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-sm font-semibold text-white leading-tight">{{ copy.title }}</span>
            @if (copy.badge) {
              <span class="flex-shrink-0 text-xs px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-medium">{{ copy.badge }}</span>
            }
          </div>
          <button
            (click)="close()"
            class="flex-shrink-0 p-0.5 text-zinc-500 hover:text-zinc-300 transition-colors"
          >
            <lucide-icon [img]="X" class="w-3.5 h-3.5"></lucide-icon>
          </button>
        </div>
        <p class="text-xs text-zinc-400 leading-relaxed">{{ copy.body }}</p>
      </div>
    </div>
  }
</span>
