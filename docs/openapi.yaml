openapi: 3.1.0
info:
  title: Containerus IPC API
  description: >
    Tauri inter-process communication (IPC) command reference for Containerus.
    Commands are invoked from the Angular frontend via `invoke('<command_name>', { ...params })`.
    All commands are async unless noted. Errors are returned as strings or domain-specific error objects.
  version: "1.0.0"
  license:
    name: MIT

tags:
  - name: containers
    description: Container lifecycle management
  - name: images
    description: Container image operations
  - name: volumes
    description: Volume management
  - name: networks
    description: Network management
  - name: compose
    description: Docker/Podman Compose project operations
  - name: ai
    description: AI provider settings and shell suggestion
  - name: systems
    description: Managed system (local/remote) configuration and connection
  - name: ssh
    description: SSH key and config utilities
  - name: settings
    description: Application-level settings
  - name: terminal
    description: Interactive terminal sessions
  - name: agent
    description: AI shell agent sessions
  - name: file-browser
    description: Remote and container filesystem operations
  - name: backend
    description: Saved Kubernetes backend connections
  - name: command-template
    description: Reusable command snippets
  - name: port-forward
    description: Container port forwarding

# ─── Shared schemas ────────────────────────────────────────────────────────────
components:
  schemas:

    ContainerRuntime:
      type: string
      enum: [docker, podman, apple]
      description: Container runtime to target

    ConnectionState:
      type: string
      enum: [connected, disconnected, connecting, error]

    ContainerAction:
      type: string
      enum: [start, stop, restart, pause, unpause, remove, kill]

    Container:
      type: object
      description: Basic container summary returned by list_containers
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        status: { type: string }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
        systemId: { type: string }
      required: [id, name, image, status, runtime, systemId]

    ContainerDetails:
      type: object
      description: Full container inspect output
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        status: { type: string }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
        ports: { type: array, items: { type: object } }
        mounts: { type: array, items: { type: object } }
        env: { type: array, items: { type: string } }
        labels: { type: object, additionalProperties: { type: string } }
      required: [id, name, image, status, runtime]

    ContainerImage:
      type: object
      properties:
        id: { type: string }
        tags: { type: array, items: { type: string } }
        size: { type: integer }
        created: { type: string, format: date-time }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
      required: [id, tags, size, created, runtime]

    Volume:
      type: object
      properties:
        name: { type: string }
        driver: { type: string }
        mountpoint: { type: string }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
      required: [name, driver, mountpoint, runtime]

    Network:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        driver: { type: string }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
      required: [id, name, driver, runtime]

    AiProviderType:
      type: string
      enum: [ollama, openai, anthropic, azure_open_ai, groq, gemini, deep_seek, mistral]

    AiModel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        provider: { $ref: '#/components/schemas/AiProviderType' }
        contextWindow: { type: integer, nullable: true }
        parameterSize: { type: string, nullable: true }
        quantizationLevel: { type: string, nullable: true }
      required: [id, name, provider]

    AiSettingsResponse:
      type: object
      properties:
        provider: { type: string }
        apiKey: { type: string, nullable: true }
        modelName: { type: string }
        endpointUrl: { type: string }
        temperature: { type: number, format: float }
        maxTokens: { type: integer }
        memoryEnabled: { type: boolean }
        summaryModel: { type: string, nullable: true }
        summaryMaxTokens: { type: integer }
        apiVersion: { type: string, nullable: true }
      required: [provider, modelName, endpointUrl, temperature, maxTokens, memoryEnabled, summaryMaxTokens]

    UpdateAiSettingsRequest:
      type: object
      properties:
        provider: { type: string }
        apiKey: { type: string, nullable: true }
        modelName: { type: string }
        endpointUrl: { type: string }
        temperature: { type: number, format: float }
        maxTokens: { type: integer }
        memoryEnabled: { type: boolean }
        summaryModel: { type: string, nullable: true }
        summaryMaxTokens: { type: integer }
        apiVersion: { type: string, nullable: true }
      required: [provider, modelName, endpointUrl, temperature, maxTokens, memoryEnabled, summaryMaxTokens]

    ShellSuggestionRequest:
      type: object
      properties:
        prompt: { type: string }
        systemId: { type: string, nullable: true }
        shell: { type: string, nullable: true }
        cwd: { type: string, nullable: true }
        recentCommands: { type: array, items: { type: string } }
      required: [prompt]

    ShellCommandResponse:
      type: object
      properties:
        command: { type: string }
        explanation: { type: string }
        isDangerous: { type: boolean }
        requiresSudo: { type: boolean }
        affectsFiles: { type: array, items: { type: string } }
        alternatives:
          type: array
          items:
            type: object
            properties:
              command: { type: string }
              description: { type: string }
            required: [command, description]
        warning: { type: string, nullable: true }
      required: [command, explanation, isDangerous, requiresSudo, affectsFiles, alternatives]

    ContainerSystem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string }
        connectionType: { type: string, enum: [local, remote] }
        availableRuntimes: { type: array, items: { $ref: '#/components/schemas/ContainerRuntime' } }
      required: [id, name, hostname, connectionType]

    NewSystemRequest:
      type: object
      properties:
        name: { type: string }
        hostname: { type: string }
        port: { type: integer, nullable: true }
        username: { type: string, nullable: true }
        connectionType: { type: string, enum: [local, remote] }
      required: [name, hostname, connectionType]

    UpdateSystemRequest:
      allOf:
        - $ref: '#/components/schemas/NewSystemRequest'
        - type: object
          properties:
            id: { type: string }
          required: [id]

    JumpHostCredentials:
      type: object
      properties:
        password: { type: string, nullable: true }
        passphrase: { type: string, nullable: true }
        privateKey: { type: string, nullable: true }

    ExtendedSystemInfo:
      type: object
      properties:
        os: { type: string }
        kernel: { type: string }
        arch: { type: string }
        cpuCount: { type: integer }
        totalMemory: { type: integer }
        diskTotal: { type: integer }
        diskUsed: { type: integer }

    LiveSystemMetrics:
      type: object
      properties:
        systemId: { type: string }
        cpuUsage: { type: number }
        memoryUsed: { type: integer }
        memoryTotal: { type: integer }
        timestamp: { type: string, format: date-time }

    SshHostEntry:
      type: object
      properties:
        host: { type: string }
        hostname: { type: string, nullable: true }
        user: { type: string, nullable: true }
        port: { type: integer, nullable: true }
        identityFile: { type: string, nullable: true }

    AppSettings:
      type: object
      properties:
        theme: { type: string }
        language: { type: string }
        autoConnect: { type: boolean }

    TerminalSession:
      type: object
      properties:
        sessionId: { type: string }
        systemId: { type: string }
        containerId: { type: string, nullable: true }
        shell: { type: string }
      required: [sessionId, systemId, shell]

    AgentSessionInfo:
      type: object
      properties:
        sessionId: { type: string }
        terminalSessionId: { type: string }
        containerId: { type: string, nullable: true }
        status: { type: string }
      required: [sessionId, terminalSessionId, status]

    AgentQueryRequest:
      type: object
      properties:
        sessionId: { type: string }
        query: { type: string }
      required: [sessionId, query]

    ConfirmationResponse:
      type: object
      properties:
        confirmed: { type: boolean }
        queryId: { type: string, nullable: true }
      required: [confirmed]

    AgentPreferences:
      type: object
      properties:
        autoConfirm: { type: boolean }
        maxContextTokens: { type: integer }

    ContextSummary:
      type: object
      properties:
        summary: { type: string }
        tokenCount: { type: integer }

    DirectoryListing:
      type: object
      properties:
        path: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              isDir: { type: boolean }
              size: { type: integer }
              modified: { type: string, format: date-time, nullable: true }
            required: [name, isDir, size]

    FileContent:
      type: object
      properties:
        content: { type: string }
        encoding: { type: string }
        size: { type: integer }
      required: [content, encoding, size]

    SavedBackendResponse:
      type: object
      properties:
        id: { type: string }
        serverUrl: { type: string }
        label: { type: string }
        hasAccessToken: { type: boolean }
      required: [id, serverUrl, label, hasAccessToken]

    CommandTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        command: { type: string }
        description: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        isFavorite: { type: boolean }
        variables: { type: array, items: { type: object } }
      required: [id, name, command, isFavorite]

    CreateCommandTemplateRequest:
      type: object
      properties:
        name: { type: string }
        command: { type: string }
        description: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        variables: { type: array, items: { type: object } }
      required: [name, command]

    UpdateCommandTemplateRequest:
      allOf:
        - $ref: '#/components/schemas/CreateCommandTemplateRequest'
        - type: object
          properties:
            id: { type: string }
          required: [id]

    PortForward:
      type: object
      properties:
        id: { type: string }
        systemId: { type: string }
        containerId: { type: string }
        containerPort: { type: integer }
        localPort: { type: integer }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
        active: { type: boolean }
      required: [id, systemId, containerId, containerPort, localPort, runtime, active]

    CreatePortForwardRequest:
      type: object
      properties:
        systemId: { type: string }
        containerId: { type: string }
        containerPort: { type: integer }
        localPort: { type: integer, nullable: true }
        runtime: { $ref: '#/components/schemas/ContainerRuntime' }
      required: [systemId, containerId, containerPort, runtime]

# ─── Commands ─────────────────────────────────────────────────────────────────
# Each "path" represents one Tauri IPC command.
# Invoke pattern: invoke('command_name', { param1: value1, ... })
paths:

  # ── Containers ──────────────────────────────────────────────────────────────

  /ipc/list_containers:
    post:
      operationId: list_containers
      tags: [containers]
      summary: List all containers for a system across all available runtimes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
              required: [systemId]
      responses:
        '200':
          description: List of containers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Container' }

  /ipc/perform_container_action:
    post:
      operationId: perform_container_action
      tags: [containers]
      summary: Perform a lifecycle action on a container
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                containerId: { type: string }
                action: { $ref: '#/components/schemas/ContainerAction' }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, containerId, action, runtime]
      responses:
        '200':
          description: Action completed

  /ipc/get_container_logs:
    post:
      operationId: get_container_logs
      tags: [containers]
      summary: Fetch container log output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                containerId: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                tail: { type: integer, nullable: true, description: Number of lines from end }
                timestamps: { type: boolean }
              required: [systemId, containerId, runtime, timestamps]
      responses:
        '200':
          description: Log text
          content:
            application/json:
              schema: { type: string }

  /ipc/inspect_container:
    post:
      operationId: inspect_container
      tags: [containers]
      summary: Return full inspect details for a container
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                containerId: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, containerId, runtime]
      responses:
        '200':
          description: Container details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerDetails' }

  # ── Images ──────────────────────────────────────────────────────────────────

  /ipc/list_images:
    post:
      operationId: list_images
      tags: [images]
      summary: List all images for a system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
              required: [systemId]
      responses:
        '200':
          description: Image list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContainerImage' }

  /ipc/pull_image:
    post:
      operationId: pull_image
      tags: [images]
      summary: Pull an image from a registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                image: { type: string, description: "Image reference (e.g. nginx:latest)" }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, image, runtime]
      responses:
        '200':
          description: Pull output
          content:
            application/json:
              schema: { type: string }

  /ipc/build_image:
    post:
      operationId: build_image
      tags: [images]
      summary: Build an image from a Dockerfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                contextPath: { type: string }
                dockerfile: { type: string, nullable: true }
                imageName: { type: string }
                tag: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                buildArgs:
                  type: array
                  items:
                    type: array
                    items: { type: string }
                    minItems: 2
                    maxItems: 2
                noCache: { type: boolean }
              required: [systemId, contextPath, imageName, tag, runtime, buildArgs, noCache]
      responses:
        '200':
          description: Build output
          content:
            application/json:
              schema: { type: string }

  /ipc/remove_image:
    post:
      operationId: remove_image
      tags: [images]
      summary: Remove an image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                imageId: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                force: { type: boolean }
              required: [systemId, imageId, runtime, force]
      responses:
        '200':
          description: Image removed

  # ── Volumes ─────────────────────────────────────────────────────────────────

  /ipc/list_volumes:
    post:
      operationId: list_volumes
      tags: [volumes]
      summary: List volumes for a system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
              required: [systemId]
      responses:
        '200':
          description: Volume list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Volume' }

  /ipc/create_volume:
    post:
      operationId: create_volume
      tags: [volumes]
      summary: Create a named volume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                name: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, name, runtime]
      responses:
        '200':
          description: Volume created

  /ipc/remove_volume:
    post:
      operationId: remove_volume
      tags: [volumes]
      summary: Remove a named volume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                name: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                force: { type: boolean }
              required: [systemId, name, runtime, force]
      responses:
        '200':
          description: Volume removed

  # ── Networks ────────────────────────────────────────────────────────────────

  /ipc/list_networks:
    post:
      operationId: list_networks
      tags: [networks]
      summary: List networks for a system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
              required: [systemId]
      responses:
        '200':
          description: Network list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Network' }

  /ipc/create_network:
    post:
      operationId: create_network
      tags: [networks]
      summary: Create a container network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                name: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                driver: { type: string, nullable: true }
                subnet: { type: string, nullable: true, description: "CIDR subnet (e.g. 172.20.0.0/16)" }
              required: [systemId, name, runtime]
      responses:
        '200':
          description: Network created

  /ipc/remove_network:
    post:
      operationId: remove_network
      tags: [networks]
      summary: Remove a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                name: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, name, runtime]
      responses:
        '200':
          description: Network removed

  /ipc/connect_container_to_network:
    post:
      operationId: connect_container_to_network
      tags: [networks]
      summary: Connect a container to a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                containerId: { type: string }
                networkName: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, containerId, networkName, runtime]
      responses:
        '200':
          description: Container connected

  /ipc/disconnect_container_from_network:
    post:
      operationId: disconnect_container_from_network
      tags: [networks]
      summary: Disconnect a container from a network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                containerId: { type: string }
                networkName: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, containerId, networkName, runtime]
      responses:
        '200':
          description: Container disconnected

  # ── Compose ─────────────────────────────────────────────────────────────────

  /ipc/compose_up:
    post:
      operationId: compose_up
      tags: [compose]
      summary: Start a Compose project (docker/podman compose up -d)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                projectName: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, projectName, runtime]
      responses:
        '200':
          description: Compose up output
          content:
            application/json:
              schema: { type: string }

  /ipc/compose_down:
    post:
      operationId: compose_down
      tags: [compose]
      summary: Stop and remove a Compose project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                projectName: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
              required: [systemId, projectName, runtime]
      responses:
        '200':
          description: Compose down output
          content:
            application/json:
              schema: { type: string }

  /ipc/compose_restart:
    post:
      operationId: compose_restart
      tags: [compose]
      summary: Restart a Compose project or specific service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                projectName: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                serviceName: { type: string, nullable: true }
              required: [systemId, projectName, runtime]
      responses:
        '200':
          description: Restart output
          content:
            application/json:
              schema: { type: string }

  /ipc/compose_logs:
    post:
      operationId: compose_logs
      tags: [compose]
      summary: Fetch logs from a Compose project or service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemId: { type: string }
                projectName: { type: string }
                runtime: { $ref: '#/components/schemas/ContainerRuntime' }
                serviceName: { type: string, nullable: true }
                tail: { type: integer, description: Number of log lines to tail }
              required: [systemId, projectName, runtime, tail]
      responses:
        '200':
          description: Log output
          content:
            application/json:
              schema: { type: string }

  # ── AI ──────────────────────────────────────────────────────────────────────

  /ipc/get_ai_settings_cmd:
    post:
      operationId: get_ai_settings_cmd
      tags: [ai]
      summary: Retrieve current AI provider settings
      responses:
        '200':
          description: AI settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSettingsResponse' }

  /ipc/update_ai_settings_cmd:
    post:
      operationId: update_ai_settings_cmd
      tags: [ai]
      summary: Update AI provider settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request: { $ref: '#/components/schemas/UpdateAiSettingsRequest' }
              required: [request]
      responses:
        '200':
          description: Settings saved

  /ipc/list_ai_models:
    post:
      operationId: list_ai_models
      tags: [ai]
      summary: List available AI models for the configured provider
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiModel' }

  /ipc/list_models_for_provider:
    post:
      operationId: list_models_for_provider
      tags: [ai]
      summary: List models for a specific provider (without saving settings)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerType: { type: string }
                apiKey: { type: string, nullable: true }
                endpointUrl: { type: string, nullable: true }
                apiVersion: { type: string, nullable: true }
              required: [providerType]
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiModel' }

  /ipc/test_ai_connection:
