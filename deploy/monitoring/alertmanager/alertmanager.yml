global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    # Configure your notification channel below.
    # Uncomment and fill in one of the options:

    # Slack:
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
    #     channel: "#containerus-alerts"
    #     title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

    # PagerDuty:
    # pagerduty_configs:
    #   - routing_key: "YOUR_PAGERDUTY_ROUTING_KEY"
    #     description: "{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"

    # Email:
    # email_configs:
    #   - to: "ops@example.com"
    #     from: "alertmanager@containerus.example.com"
    #     smarthost: "smtp.example.com:587"
    #     auth_username: "alertmanager"
    #     auth_password: "password"

  - name: "critical"
    # Same options as above; critical alerts can use a different channel/rotation.

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
