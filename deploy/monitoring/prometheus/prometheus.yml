global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: containerus-prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "containerus-server"
    static_configs:
      - targets: ["app:8080"]
    metrics_path: /api/health/metrics
    scrape_interval: 15s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
    scrape_interval: 30s
