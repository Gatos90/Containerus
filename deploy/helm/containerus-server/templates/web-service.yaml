{{- if .Values.web.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerus-server.fullname" . }}-web
  labels:
    {{- include "containerus-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "containerus-server.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
