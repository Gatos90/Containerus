# Staging overlay for the shared test server at 87.106.170.40.
# Applied on top of the release's currently-stored values via:
#   helm upgrade containerus-server ./deploy/helm/containerus-server \
#     --reuse-values -f deploy/helm/containerus-server/values-staging.yaml
# (secrets + DB URL stay in the stored release values; this file only carries
#  what needs to change to add the frontend + split ingress paths.)

web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/gatos90/containerus-web
    pullPolicy: IfNotPresent
    tag: "sha-4e6cdf5"
  apiBase: "/api"

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: 87.106.170.40.nip.io
      paths:
        # /api wins over / because more-specific prefixes match first in traefik/ingress-nginx
        - path: /api
          pathType: Prefix
          service:
            name: '{{ include "containerus-server.fullname" . }}'
            port: 80
        - path: /
          pathType: Prefix
          service:
            name: '{{ include "containerus-server.fullname" . }}-web'
            port: 80
  tls: []
