# Staging overlay for the shared test server at 87.106.170.40.
# Applied on top of the release's currently-stored values via:
#   helm upgrade containerus-server ./deploy/helm/containerus-server \
#     --reset-then-reuse-values -f deploy/helm/containerus-server/values-staging.yaml
# (secrets + DB URL stay in the stored release values; this file only carries
#  what needs to change for this environment.)
#
# Staging exposes the backend API only. The Containerus desktop app runs on
# each user's machine and points at http://87.106.170.40.nip.io — it calls the
# backend directly under /api/*. We intentionally do NOT deploy the Angular
# web frontend here (see CON-108).

web:
  enabled: false

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: 87.106.170.40.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls: []
