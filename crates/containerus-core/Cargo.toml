[package]
name = "containerus-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Containerus - shared between desktop and server"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# SSH
russh = "0.57"
russh-keys = "0.49"
ssh-key = { version = "0.6", features = ["std"] }
ssh-encoding = "0.2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"

# Utilities
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.10"
once_cell = "1.18"
dirs = "5.0"
glob = "0.3"
base64 = "0.22"

# Concurrency
parking_lot = "0.12"
dashmap = "6"

# Logging
tracing = "0.1"

# AI/LLM
rig-core = { version = "0.28.0", default-features = false, features = ["reqwest-rustls"] }
tokio-stream = "0.1.18"
futures = "0.3.31"
schemars = "1.2.0"
whoami = "2.0.2"

# Terminal emulation for processing PTY output
vt100 = "0.15"

# Open URLs
open = "5"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
