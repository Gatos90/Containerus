name: Security

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    # Run full audit weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust dependency audit ──────────────────────────────────────────────────
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  # ── npm dependency audit ───────────────────────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  # ── Rust SAST (clippy with deny) ───────────────────────────────────────────
  clippy-deny:
    name: Clippy (SAST)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # ── Secret scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Database migration safety check ───────────────────────────────────────
  migration-check:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: containerus_test
          POSTGRES_USER: containerus
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U containerus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations against test DB
        env:
          DATABASE_URL: postgres://containerus:testpass@localhost:5432/containerus_test
        run: |
          sqlx migrate run \
            --source crates/containerus-server/migrations \
            --database-url "$DATABASE_URL"

      - name: Check migrations are idempotent (re-run)
        env:
          DATABASE_URL: postgres://containerus:testpass@localhost:5432/containerus_test
        run: |
          sqlx migrate run \
            --source crates/containerus-server/migrations \
            --database-url "$DATABASE_URL"
          echo "Re-run succeeded — migrations are idempotent."

      - name: Verify migration files are sorted
        run: |
          prev=""
          while IFS= read -r f; do
            name=$(basename "$f")
            if [[ "$name" < "$prev" ]]; then
              echo "::error::Migration files are not in order: $name comes after $prev"
              exit 1
            fi
            prev="$name"
          done < <(find crates/containerus-server/migrations -name "*.sql" | sort)
          echo "Migration file order OK."

  # ── Container image scanning ───────────────────────────────────────────────
  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -f crates/containerus-server/Dockerfile \
            -t containerus-server:scan \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "containerus-server:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # ── Gate: all security checks passed ─────────────────────────────────────
  security-gate:
    name: Security Gate
    needs: [cargo-audit, npm-audit, clippy-deny, secret-scan, migration-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          results=(
            "cargo-audit:${{ needs.cargo-audit.result }}"
            "npm-audit:${{ needs.npm-audit.result }}"
            "clippy-deny:${{ needs.clippy-deny.result }}"
            "secret-scan:${{ needs.secret-scan.result }}"
            "migration-check:${{ needs.migration-check.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            job="${r%%:*}"
            status="${r##*:}"
            if [[ "$status" != "success" ]]; then
              echo "::error::$job failed with status: $status"
              failed=1
            fi
          done
          if [[ $failed -eq 1 ]]; then exit 1; fi
          echo "All security checks passed."
