name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: pnpm test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

      - name: Frontend coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Frontend Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const data = require('./coverage/coverage-summary.json');
              const total = data.total;
              console.log('Statements : ' + total.statements.pct + '%');
              console.log('Branches   : ' + total.branches.pct + '%');
              console.log('Functions  : ' + total.functions.pct + '%');
              console.log('Lines      : ' + total.lines.pct + '%');
            "  >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  security-audit:
    name: Security Audit (pnpm + cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (prod, fail on high)
        run: pnpm audit --prod --audit-level high

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            .

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate src-tauri coverage
        working-directory: src-tauri
        run: cargo llvm-cov --lib --json --output-path ../rust-coverage.json

      - name: Check src-tauri coverage threshold (60%)
        run: |
          node -e "
            const data = require('./rust-coverage.json');
            const pct = data.data[0].totals.lines.percent;
            console.log('src-tauri lines coverage: ' + pct.toFixed(2) + '%');
            if (pct < 60) {
              console.error('ERROR: src-tauri coverage ' + pct.toFixed(2) + '% is below 60% threshold');
              process.exit(1);
            }
            console.log('src-tauri coverage gate passed');
          "

      - name: Generate containerus-server coverage
        run: cargo llvm-cov --package containerus-server --lib --json --output-path server-coverage.json

      - name: Check containerus-server coverage threshold (70%)
        run: |
          node -e "
            const data = require('./server-coverage.json');
            const pct = data.data[0].totals.lines.percent;
            console.log('containerus-server lines coverage: ' + pct.toFixed(2) + '%');
            if (pct < 70) {
              console.error('ERROR: containerus-server coverage ' + pct.toFixed(2) + '% is below 70% threshold');
              process.exit(1);
            }
            console.log('containerus-server coverage gate passed');
          "

      - name: Upload Rust coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            rust-coverage.json
            server-coverage.json
          retention-days: 14

      - name: Rust coverage summary
        if: always()
        run: |
          echo "## Rust Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f rust-coverage.json ]; then
            node -e "
              const data = require('./rust-coverage.json');
              if (data.data && data.data[0]) {
                const totals = data.data[0].totals;
                if (totals.lines) console.log('src-tauri lines      : ' + (totals.lines.percent || 0).toFixed(2) + '% (threshold: 60%)');
                if (totals.functions) console.log('src-tauri functions  : ' + (totals.functions.percent || 0).toFixed(2) + '%');
              }
            " >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f server-coverage.json ]; then
            node -e "
              const data = require('./server-coverage.json');
              if (data.data && data.data[0]) {
                const totals = data.data[0].totals;
                if (totals.lines) console.log('server lines         : ' + (totals.lines.percent || 0).toFixed(2) + '% (threshold: 70%)');
                if (totals.functions) console.log('server functions     : ' + (totals.functions.percent || 0).toFixed(2) + '%');
              }
            " >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  test-results:
    name: All Tests Pass
    needs: [frontend-tests, rust-tests, e2e-tests, security-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.frontend-tests.result }}" != "success" ] || [ "${{ needs.rust-tests.result }}" != "success" ] || [ "${{ needs.e2e-tests.result }}" != "success" ] || [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "::error::One or more test jobs failed"
            echo "Frontend: ${{ needs.frontend-tests.result }}"
            echo "Rust: ${{ needs.rust-tests.result }}"
            echo "E2E: ${{ needs.e2e-tests.result }}"
            echo "Security Audit: ${{ needs.security-audit.result }}"
            exit 1
          fi
          echo "All tests passed!"
